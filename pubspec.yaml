name: plus_vpn
description: PlusVPN — Android Xray client with Liquid Glass and Material You.
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray_client: 3.5.0
  dynamic_color: ^1.8.1
  palette_generator: ^0.3.3+7
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  http: ^1.5.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/images/
  fonts:
    - family: PlusDynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff-400.ttf
          weight: 400
        - asset: assets/fonts/DynaPuff-700.ttf
          weight: 700
    - family: PlusInter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: PlusNunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    - family: PlusRubikOne
      fonts:
        - asset: assets/fonts/RubikOne-400.ttf
          weight: 400
    - family: PlusComfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-400.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa-600.ttf
          weight: 600
        - asset: assets/fonts/Comfortaa-700.ttf
          weight: 700
